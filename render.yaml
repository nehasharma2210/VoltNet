services:
  # Full-stack Docker service (Backend + Frontend)
  - type: web
    name: voltnet-fullstack
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: BACKEND_URL
        value: http://localhost:10000
        
