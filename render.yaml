services:
  # Backend API Service
  - type: web
    name: voltnet-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: "3.10"
    rootDir: backend
    
  # Frontend Static Site
  - type: static
    name: voltnet-frontend
    buildCommand: |
      # Replace backend URL in config
      sed -i 's|${BACKEND_URL}|https://voltnet-backend.onrender.com|g' config.js
    staticPublishPath: .
    rootDir: frontend
    envVars:
      - key: BACKEND_URL
        value: https://voltnet-backend.onrender.com