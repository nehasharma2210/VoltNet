services:
  # Backend API Service
  - type: web
    name: voltnet-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
        
  # Frontend Static Site
  - type: static
    name: voltnet-frontend
    buildCommand: |
      # Update config.js with backend URL
      sed -i 's|http://localhost:8000|https://voltnet-backend.onrender.com|g' frontend/config.js
      sed -i 's|http://backend:8000|https://voltnet-backend.onrender.com|g' frontend/config.js
    staticPublishPath: frontend
    envVars:
      - key: BACKEND_URL
        value: https://voltnet-backend.onrender.com